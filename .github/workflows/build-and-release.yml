name: Build and release compressed tailscale ARM64 binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tailscale version to build (for example 1.88.3)
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx zip

      - name: Download and compress binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="tailscale_${VERSION}_static_arm64.tgz"
          url="https://pkgs.tailscale.com/stable/${archive}"

          curl -fsSLo "${archive}" "${url}"
          expected_sha="$(curl -fsSL "${url}.sha256" | awk '{print $1}')"
          actual_sha="$(sha256sum "${archive}" | awk '{print $1}')"
          test -n "${expected_sha}"
          test "${expected_sha}" = "${actual_sha}"

          tar -xzf "${archive}"

          extracted_dir="tailscale_${VERSION}_static_arm64"
          test -f "${extracted_dir}/tailscale"
          test -f "${extracted_dir}/tailscaled"

          upx --best "${extracted_dir}/tailscale" "${extracted_dir}/tailscaled"
          zip -j "tailscale-arm64-upx-${VERSION}.zip" "${extracted_dir}/tailscale" "${extracted_dir}/tailscaled"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Tailscale ARM64 UPX v${{ inputs.version }}
          files: tailscale-arm64-upx-${{ inputs.version }}.zip
